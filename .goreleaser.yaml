version: 2

project_name: archdoc

before:
  hooks:
    - go mod tidy

builds:
  - id: archdoc
    main: ./cmd/archdoc
    binary: archdoc
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # main.version falls back to the module's build info and then to "dev", so
    # this is what makes a release binary report its tag. The tag is used
    # rather than the bare version, because `archdoc --version` prints the tag.
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  # The generated workflow downloads archdoc_<version>_linux_amd64.tar.gz and
  # extracts a binary called archdoc from the root of it. Changing this name
  # breaks every repository already scaffolded, because those workflows are
  # pinned to the release they were written for.
  - id: archdoc
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Globs only: goreleaser warns on a glob that matches nothing but hard
    # errors on a literal name, so a missing LICENSE must not fail a release.
    files:
      - LICENSE*
      - README*

checksum:
  # The workflow verifies its download against this, so the name is part of the
  # contract with every scaffolded repository.
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto

homebrew_casks:
  # Writes Casks/archdoc.rb into the tap. The cask downloads the archives
  # above and checks them against their sha256, so it depends on the archive
  # name template as much as the scaffolded workflow does.
  - repository:
      owner: ollieread
      name: homebrew-tap
      # GITHUB_TOKEN is scoped to this repository and cannot push to the tap.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/ollieread/archdoc
    description: Manage a specification repository of RFCs, ADRs, spec pages and refs
    # Prereleases are not written to the tap: brew install gives the latest
    # stable release, and alphas stay on the releases page.
    skip_upload: auto
    commit_author:
      name: goreleaser
      email: bot@goreleaser.com
    commit_msg_template: "feat(archdoc): Release {{ .Tag }}"
    # The binaries are not notarised, so Gatekeeper kills the quarantined one
    # Homebrew downloads. This is GoReleaser's documented workaround for
    # unsigned binaries. Signing and notarising them would make it unnecessary.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/archdoc"]
          end
