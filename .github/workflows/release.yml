name: release

on:
  push:
    tags: ['v*']

permissions:
  # Required to create the release and upload its assets.
  contents: write

jobs:
  goreleaser:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: goreleaser resolves .Tag from them and builds the
      # changelog from the commits since the previous one. A shallow checkout
      # produces a release labelled from nothing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Every repository archdoc scaffolds pins itself to a release, and cannot
      # easily be moved off a broken one. The suite runs again here rather than
      # trusting that it ran on the commit before the tag.
      # The tag also lets internal/lint refuse a rule entry naming a release
      # later than this one, which it cannot check on any other run.
      - name: go test
        run: go test ./...
        env:
          ARCHDOC_RELEASE_TAG: ${{ github.ref_name }}

      # Publishes archdoc_<version>_<os>_<arch> archives and checksums.txt. The
      # archdochq/setup reconstructs those exact names to download and
      # verify the binary, so renaming either side breaks every existing
      # repository. release_test.go pins the agreement.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token with contents write on archdochq/homebrew-tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # The specification is published from the same tag, once the release exists.
  # It is a separate job calling the workflow that already knows how, rather
  # than a copy of its steps that could drift from them.
  publish-spec:
    name: Publish the specification
    needs: goreleaser
    uses: ./.github/workflows/publish-spec.yml
    secrets: inherit

  # The guides are published as skills from archdochq/skills, which only this
  # job writes, from the tag, so an installed copy holds the guides of the
  # release that wrote it. Stable releases only, as with the Homebrew tap.
  skills:
    name: Publish the skills
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A deploy key with write access to archdochq/skills alone; this
      # workflow's own token cannot push to another repository.
      - uses: actions/checkout@v7
        with:
          repository: archdochq/skills
          ssh-key: ${{ secrets.SKILLS_DEPLOY_KEY }}
          path: skills

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Write the skills repository
        run: go run ./plugin/build.go skills "${GITHUB_REF_NAME#v}"

      # Lightweight, because Gemini CLI checks a pinned install by comparing
      # its commit with the hash ls-remote gives for the ref, which for an
      # annotated tag is the tag object's. Atomic, so a rejected push leaves
      # neither the commit nor the tag and the job can be re-run.
      - name: Commit, tag and push
        working-directory: skills
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat(archdoc): Release $GITHUB_REF_NAME"
          git tag "$GITHUB_REF_NAME"
          git push --atomic origin HEAD "refs/tags/$GITHUB_REF_NAME"
